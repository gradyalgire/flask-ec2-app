{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an Account</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
  <label>Username <input type="text" name="username" required></label>
  <label>Password <input type="password" name="password" required></label>
  <label>First Name <input type="text" name="firstname" required></label>
  <label>Last Name <input type="text" name="lastname" required></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Address <input type="text" name="address" required></label>
  <label>Upload Text File (Limerick.txt) <input type="file" name="file" accept=".txt" required></label>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in here</a></p>
{% endblock %}
