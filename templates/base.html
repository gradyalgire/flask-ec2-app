<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flask App{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; }
    .card { max-width: 420px; margin: 40px auto; background: #fff; padding: 28px;
            border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 5px; }
    button, .btn { display: inline-block; margin-top: 18px; padding: 10px 16px; background: #2563eb;
                   color: #fff; border: none; border-radius: 5px; font-size: 15px;
                   cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #6b7280; }
    .error { background: #fde2e2; color: #9b1c1c; padding: 10px; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 8px 4px; border-bottom: 1px solid #eee; }
    td:first-child { font-weight: bold; width: 40%; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
